name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Needed so the "Attach to GitHub Release" step can create/update releases
# and upload assets (the repo's default GITHUB_TOKEN is read-only).
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 7's android library (source/target compatibility) and AGP 8.7
          # build fine on 21; the library is compiled with JavaVersion.VERSION_21
          # so 17 fails to compile it ("invalid source release: 21").
          java-version: "21"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync web assets into the Android project
        working-directory: mobile
        run: npx cap sync android

      # The ubuntu-latest image already ships an Android SDK (ANDROID_SDK_ROOT)
      # with accepted licenses — no setup action needed (that's also what the
      # official nowinandroid workflow does). This step only makes sure the SDK
      # is writable and has the platform/build-tools our project pins; every
      # command tolerates failure so the preinstalled SDK is always the fallback.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK root: $SDK"
          sudo chown -R "$USER" "$SDK" 2>/dev/null || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            for d in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
              [ -x "$d" ] && SM="$d" && break
            done
          fi
          if [ -x "$SM" ]; then
            echo "sdkmanager: $SM"
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          else
            echo "No sdkmanager found — relying on the preinstalled SDK."
          fi

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Publish under a friendly, stable name instead of the Gradle default.
      - name: Rename APK for release
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/TechIntel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechIntel-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Earlier runs attached the APK under its Gradle name (app-debug.apk).
      # Drop the stale asset so the release only carries the friendly name.
      - name: Remove stale app-debug.apk asset
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="/repos/$GITHUB_REPOSITORY/releases/tags/${GITHUB_REF_NAME}"
          n=0
          for id in $(gh api "$url" --jq '.assets[] | select(.name=="app-debug.apk") | .id'); do
            echo "deleting stale asset $id"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$id" && n=$((n+1))
          done
          echo "removed $n stale asset(s)"

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/TechIntel.apk
          # v2 updates an existing release and overwrites duplicate asset
          # names natively (overwrite_files defaults to true), so the two
          # parallel tag builds can both update the same release. (The old v1
          # "allowUpdates" input is gone; it was a no-op.)