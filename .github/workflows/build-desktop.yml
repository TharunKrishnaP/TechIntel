name: Build Desktop EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Needed so the "Attach to GitHub Release" step can create/update releases
# and upload assets (the repo's default GITHUB_TOKEN is read-only), and the
# SignPath OSS signing step can read the uploaded artifact.
permissions:
  contents: write
  actions: read

jobs:
  exe:
    runs-on: windows-latest
    env:
      # Mirrored from the repo secret so steps can gate on its presence in
      # `if:` conditions — the `secrets` context is NOT allowed inside `if:`.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build + runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Regenerate icons (PNG / ICO / Android mipmaps)
        run: python -m backend.make_icons

      - name: Build one-file EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TechIntel `
            --icon frontend\icons\techintel.ico `
            --add-data "frontend;frontend" `
            --collect-submodules uvicorn `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import webview.platforms.winforms `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            desktop\launcher.py

      # --- Free OSS code signing (SignPath Foundation / SignPath.io) ---
      # Fully inactive until the FOUR secrets below exist in the repo (Settings →
      # Secrets and variables → Actions). Once added, tag builds submit the EXE
      # for signing and swap in the signed copy before upload/release, which
      # removes the SmartScreen/"not commonly downloaded" warnings. Nothing here
      # changes the unsigned path used today. See docs/CODE-SIGNING.md.
      - name: Upload unsigned EXE for signing
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: techintel-exe-unsigned
          path: dist/TechIntel.exe

      - name: Sign the EXE via SignPath (free OSS)
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNPATH_API_TOKEN != ''
        id: signpath-sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: "true"
          output-artifact-directory: signed

      - name: Swap in the signed EXE
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNPATH_API_TOKEN != ''
        run: |
          Copy-Item -Force "signed\TechIntel.exe" "dist\TechIntel.exe"
          Get-ChildItem signed | ForEach-Object { "signed artifact: $($_.Name) $($_.Length) bytes" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechIntel-Desktop-EXE
          path: dist/TechIntel.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TechIntel.exe
          # v2 updates an existing release and overwrites duplicate asset
          # names natively (overwrite_files defaults to true), so the two
          # parallel tag builds can both update the same release. (The old v1
          # "allowUpdates" input is gone; it was a no-op.)